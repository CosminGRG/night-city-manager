appId: com.cosmingrg.fixer
productName: Fixer
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: out/renderer/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
extraResources:
  - from: resources/7zip
    to: 7zip
electronLanguages:
  - en-US
win:
  executableName: Fixer Mod Manager
  target:
    - target: zip
      arch: x64
  artifactName: ${productName}-${version}-win-x64.${ext}
npmRebuild: false
